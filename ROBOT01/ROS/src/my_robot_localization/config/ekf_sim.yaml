ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    sensor_timeout: 0.2
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.1
    publish_tf: true
    publish_acceleration: false
    print_diagnostics: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # Treat Gazebo ground-truth odometry as wheel odometry for initial filter
    # integration. Fuse planar body velocity, including mecanum lateral Vy.
    odom0: /odometry/wheel
    odom0_config: [
      false, false, false,  # Position
      false, false, false,  # Orientation
      true,  true,  false,  # Vx, Vy
      false, false, true,   # Yaw velocity
      false, false, false   # Acceleration
    ]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    # Start with gyro Z only. All six axes remain published so linear
    # acceleration can be enabled after its covariance has been tuned.
    imu0: /imu_sensor_L_broadcaster/imu
    imu0_config: [
      false, false, false,
      false, false, false,
      false, false, false,
      false, false, true,
      false, false, false
    ]
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: false

    imu1: /imu_sensor_R_broadcaster/imu
    imu1_config: [
      false, false, false,
      false, false, false,
      false, false, false,
      false, false, true,
      false, false, false
    ]
    imu1_differential: false
    imu1_relative: false
    imu1_queue_size: 10
    imu1_remove_gravitational_acceleration: false
