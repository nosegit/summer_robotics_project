# ==============================================================================
# MINIMAL NAV2 PARAMETERS (Mecanum / Holonomic Optimized)
# ==============================================================================

amcl:
  ros__parameters:
    use_sim_time: false
    transform_tolerance: 0.3
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_link"
    global_frame_id: "map"
    odom_frame_id: "odom"
    scan_topic: "scan"
    laser_min_range: 0.15
    laser_max_range: 12.0
    max_beams: 90
    # Update localization after about 1.1 degrees or 5 cm instead of waiting
    # for the Nav2 defaults of 11.5 degrees or 25 cm.
    update_min_a: 0.02
    update_min_d: 0.05
    set_initial_pose: true
    initial_pose: [0.0, 0.0, 0.0, 0.0]
    robot_model_type: "nav2_amcl::OmniMotionModel"

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    # Enable error codes to prevent modern Nav2 warnings
    error_code_names:
      - compute_path
      - follow_path
      - spin
      - wait
      - backup

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0 # 20.0
    min_x_velocity_threshold: 0.05
    min_y_velocity_threshold: 0.05
    min_theta_velocity_threshold: 0.15
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # Progress Checker (Keeps track of whether the robot is stuck)
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    # Goal Checker (Determines when the robot has reached its target)
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25 #0.25
      yaw_goal_tolerance: 0.1 #0.25

    # DWB Local Planner (Configured for Holonomic/Mecanum Translation)
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: true
      
      # Linear Velocities (Matched for 7Hz scan time)
      min_vel_x: -0.3
      max_vel_x: 0.3
      min_vel_y: -0.3      
      max_vel_y: 0.3       
      max_speed_xy: 0.3      
      min_speed_xy: 0.0

      # Rotational Velocities (Matched to prevent Scan Skew)
      min_speed_theta: 0.15
      max_vel_theta: 0.3

      # Accelerations (Matched to prevent Mecanum wheel slip)
      acc_lim_x: 1.0         
      acc_lim_y: 1.0         
      acc_lim_theta: 0.8     
      decel_lim_x: -1.0      
      decel_lim_y: -1.0      
      decel_lim_theta: -0.8  

      # Sampling Space
      vx_samples: 20
      vy_samples: 20        
      vtheta_samples: 20
      # Basic DWB Critics
      # critics: ["ObstacleFootprint", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      # ObstacleFootprint.scale: 0.02
      # PathAlign.scale: 32.0 # 32.0
      # PathAlign.forward_point_distance: 0.325
      # GoalAlign.scale: 24.0 # 24.0
      # GoalAlign.forward_point_distance: 0.325
      # PathDist.scale: 32.0
      # GoalDist.scale: 24.0

      # Ensure PathAlign and GoalAlign are listed in critics
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalDist", "PathDist", "PathAlign", "GoalAlign"]
      
      # --- Critic Weights ---
      PathDist.scale: 32.0       # Pulls the trajectory toward the path line
      GoalDist.scale: 24.0       # Drives forward toward goal
      BaseObstacle.scale: 2.0    # Balanced so it doesn't freak out near gap walls
      
      # --- Aim Toward Path Alignment Settings ---
      PathAlign.scale: 16.0      # Penalizes trajectories not heading parallel to path
      PathAlign.forward_point_distance: 0.3  # Lookahead distance (m) to measure heading alignment
      
      GoalAlign.scale: 1.0      # Keeps nose aligned toward local goal targets
      GoalAlign.forward_point_distance: 0.3

    # --- MPPI Controller Configuration ---
    # FollowPath:
    #   plugin: "nav2_mppi_controller::MPPIController"
    #   time_steps: 56
    #   model_dt: 0.05
    #   batch_size: 2000
      
    #   # TELL MPPI IT IS A MECANUM ROBOT
    #   motion_model: "Omni"
      
    #   # Velocity limits (Make X and Y equal for smooth diagonal movement)
    #   vx_max: 0.5
    #   vx_min: -0.5
    #   vy_max: 0.5
    #   vy_min: -0.5
    #   vtheta_max: 1.0

    #   vx_std: 0.2
    #   vy_std: 0.2
    #   wz_std: 0.4
      
    #   # Remove "PreferForwardCritic" and "PathAngleCritic" to prevent RC-car behavior
    #   critics: ["ConstraintCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic"]
      
    #   # Critic Weights
    #   ConstraintCritic.scale: 20.0
    #   PathFollowCritic.scale: 5.0
    #   GoalCritic.scale: 3.0
      
    #   # Turn these down so the robot strafes instead of turning to face the path
    #   GoalAngleCritic.scale: 30.0 
    #   PathAlignCritic.scale: 2.0    

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["backup", "spin" , "wait"]
    backup:
      plugin: "my_robot_nav2_behavior::MecanumEscape"
      odom_topic: /odom
      projection_step: 0.05
      search_distance: 0.60
      clearance_margin: 0.05
      simulate_ahead_time: 2.0
      min_remembered_speed: 0.03
      velocity_memory_duration: 30.0
      direction_preference_weight: 0.35
      clearance_weight: 0.65
    spin:
      plugin: "nav2_behaviors::Spin"
    wait:
      plugin: "nav2_behaviors::Wait"



global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      resolution: 0.05
      # robot_radius: 0.30   # Replace with your actual physical robot radius in meters
      footprint: "[ [0.175, 0.18], [0.175, -0.18], [-0.175, -0.18], [-0.175, 0.18] ]"
      footprint_padding: 0.05 # 5cm padding
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          obstacle_max_range: 2.5
      
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0
        inflation_radius: 0.45

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # robot_radius: 0.30   # Replace with your actual physical robot radius in meters
      footprint: "[ [0.175, 0.18], [0.175, -0.18], [-0.175, -0.18], [-0.175, 0.18] ]"
      footprint_padding: 0.05 # 5cm padding
      plugins: ["obstacle_layer", "inflation_layer"]
      
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          obstacle_max_range: 2.5
      
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 30.0
        inflation_radius: 0.45

collision_monitor:
  ros__parameters:
    use_sim_time: false
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    update_frequency: 10.0
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    transform_tolerance: 0.5
    source_timeout: 2.0
    stop_pub_timeout: 0.5
    # Define what data stream the collision monitor should watch
    observation_sources: ["scan"]
    # state_topic: "collision_monitor_state"
    
    scan:
      type: "scan"
      topic: "/scan"

    # Define the safety zones relative to base_link
    # polygons: ["PolygonStop"]
    # PolygonStop:
    #   type: "polygon"
    #   # Outer quotes are required so ROS 2 parses this as a string:
    #   # points: "[[0.375, 0.30], [0.375, -0.30], [-0.375, -0.30], [-0.375, 0.30]]"
    #   points: "[[0.225, 0.23], [0.225, -0.23], [-0.225, -0.23], [-0.225, 0.23]]"
    #   action_type: "stop"
    #   min_points: 4
    #   visualize: True
    #   polygon_pub_topic: "polygon_stop"
    #   enabled: True

    # Recovery behaviors already collision-check the local costmap. An approach
    # polygon here can clamp Spin/BackUp to zero when recovery starts near an
    # obstacle, causing both behaviors to time out without any robot motion.
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "local_costmap/published_footprint"
      time_before_collision: 2.0
      simulation_time_step: 0.05
      min_points: 4
      visualize: true
      polygon_pub_topic: "footprint_approach"
      enabled: false

docking_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_link"
    odom_frame: "odom"
    
    # Provide a dummy charging dock to satisfy the server
    dock_plugins: ['charging_dock']
    charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.5
      use_external_detection_pose: false
      use_battery_status: false

slam_toolbox:
  ros__parameters:
    use_sim_time: false
    odom_frame: "odom"
    base_frame: "base_link"
    scan_topic: "/scan"
    mode: "mapping"
    # RPLIDAR A1: 0.15-12 m range, measured at about 7.6 scans/s.
    throttle_scans: 1
    scan_queue_size: 1
    restamp_tf: false
    map_update_interval: 1.0
    resolution: 0.05
    min_laser_range: 0.15
    max_laser_range: 12.0
    # The A1 currently publishes at about 7.6 Hz (one scan every 0.13 s).
    # Process each available scan instead of throttling SLAM to 2 Hz.
    minimum_time_interval: 0.1
    minimum_travel_distance: 0.05
    minimum_travel_heading: 0.02
    check_min_dist_and_heading_precisely: false
    use_scan_matching: true
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    transform_publish_period: 0.02

velocity_smoother:
  ros__parameters:
    # Nav2 bringup remaps controller and behavior commands to cmd_vel_nav.
    # Smooth them first, then let collision_monitor be the sole /cmd_vel publisher.
    input_topic: "cmd_vel_nav"
    output_topic: "cmd_vel_smoothed"
    smoothing_frequency: 10.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    
    # FORMAT IS: [X, Y, THETA]
    # This is the magic unlock: Ensure the middle number (Y) matches your X limit!
    max_velocity: [0.3, 0.3, 0.3]     
    min_velocity: [-0.3, -0.3, -0.3]  
    
    # You MUST also provide Y-axis acceleration limits, or it will refuse to slide
    max_accel: [1.2, 1.2, 1.0]
    max_decel: [-1.2, -1.2, -1.0]
    
    deadband_velocity: [0.0, 0.0, 0.0]
    odom_topic: "odom"
    odom_duration: 0.1

# ==============================================================================
# LIFECYCLE MANAGEMENT (Brings the stack up in sequence)
# ==============================================================================
lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: ['controller_server',
                'velocity_smoother',
                'planner_server',
                'behavior_server',
                'bt_navigator',
                'collision_monitor'] #

lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: ['amcl']

