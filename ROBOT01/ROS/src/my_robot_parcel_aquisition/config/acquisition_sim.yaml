parcel_acquisition_manager:
  ros__parameters:
    cmd_vel_topic: /cmd_vel
    cube_detections_topic: /aruco/cubes
    base_frame: base_link
    detection_timeout: 2.0
    search_speed: 0.1 # 0.08
    search_timeout: 180.0
    search_center_kp: 0.5
    search_center_tolerance: 0.05
    search_center_settle_cycles: 3
    search_reacquire_timeout: 2.0
    servo_rate: 20.0
    servo_timeout: 60.0
    target_x: 0.0
    target_y: 0.5
    target_yaw: -1.57079632679
    kp_x: 0.6
    kp_y: 1.15 # 0.8
    kp_yaw: 1.5
    position_tolerance: 0.01
    yaw_tolerance: 0.03
    settle_cycles: 5
    max_linear_velocity: 0.2
    max_angular_velocity: 0.5
    rotate_speed: 0.3
    odometry_topic: /odometry/wheel
    odometry_timeout: 2.0
    rotate_kp: 1.25
    rotate_min_speed: 0.15
    rotate_tolerance: 0.01
    rotate_timeout: 120.0
    rotate_rate: 20.0
    rotate_settle_cycles: 3
