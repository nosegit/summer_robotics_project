controller_manager:
  ros__parameters:
    update_rate: 50

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    imu_sensor_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster

    ir_sensor_1_broadcaster:
      type: range_sensor_broadcaster/RangeSensorBroadcaster

    ir_sensor_2_broadcaster:
      type: range_sensor_broadcaster/RangeSensorBroadcaster

    wheel_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController
    
    servo_position_controller:
      type: position_controllers/JointGroupPositionController

imu_sensor_broadcaster:
  ros__parameters:
    sensor_name: "imu_sensor"
    frame_id: "imu_sensor"

ir_sensor_1_broadcaster:
  ros__parameters:
    sensor_name: "ir_sensor_1"
    frame_id: "ir_sensor_1"
    radiation_type: 1 # 1 = Infrared

ir_sensor_2_broadcaster:
  ros__parameters:
    sensor_name: "ir_sensor_2"
    frame_id: "ir_sensor_2"
    radiation_type: 1 # 1 = Infrared

# Configure which joints the controllers talk to
wheel_velocity_controller:
  ros__parameters:
    joints:
      - wheel1_joint
      - wheel2_joint

servo_position_controller:
  ros__parameters:
    joints:
      - servo1_joint  # Use the exact name from your URDF