# ==============================================================================
# MINIMAL NAV2 PARAMETERS (Mecanum / Holonomic Optimized)
# ==============================================================================

amcl:
  ros__parameters:
    use_sim_time: false
    transform_tolerance: 1.0
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_link"
    global_frame_id: "map"
    odom_frame_id: "odom"
    scan_topic: "scan"
    set_initial_pose: true
    initial_pose: [0.0, 0.0, 0.0, 0.0]
    robot_model_type: "nav2_amcl::OmniMotionModel"

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    # Enable error codes to prevent modern Nav2 warnings
    error_code_names:
      - compute_path
      - follow_path
      - spin
      - wait
      - backup

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0 # 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # Progress Checker (Keeps track of whether the robot is stuck)
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    # Goal Checker (Determines when the robot has reached its target)
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    # # DWB Local Planner (Configured for Holonomic/Mecanum Translation)
    # FollowPath:
    #   plugin: "dwb_core::DWBLocalPlanner"
    #   debug_trajectory_details: true
    #   min_vel_x: -0.26
    #   max_vel_x: 0.26
    #   min_vel_y: -0.26      # Enabled for Mecanum (Lateral movements)
    #   max_vel_y: 0.26       # Enabled for Mecanum (Lateral movements)
    #   max_vel_theta: 1.0
    #   min_speed_xy: 0.0
    #   max_speed_xy: 0.26
    #   min_speed_theta: 0.0
    #   acc_lim_x: 2.5
    #   acc_lim_y: 2.5        # Lateral acceleration limit
    #   acc_lim_theta: 3.2
    #   decel_lim_x: -2.5
    #   decel_lim_y: -2.5
    #   decel_lim_theta: -3.2
    #   vx_samples: 20
    #   vy_samples: 20        # Sample lateral speeds
    #   vtheta_samples: 20
    #   # Basic DWB Critics
    #   # critics: ["ObstacleFootprint", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
    #   # ObstacleFootprint.scale: 0.02
    #   # PathAlign.scale: 32.0 # 32.0
    #   # PathAlign.forward_point_distance: 0.325
    #   # GoalAlign.scale: 24.0 # 24.0
    #   # GoalAlign.forward_point_distance: 0.325
    #   # PathDist.scale: 32.0
    #   # GoalDist.scale: 24.0

    #   critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalDist", "PathDist"]
    #   PathDist.scale: 32.0
    #   GoalDist.scale: 24.0
    #   BaseObstacle.scale: 0.02
    #   Oscillation.scale: 1.0
    #   RotateToGoal.scale: 0.1

    # --- MPPI Controller Configuration ---
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      
      # TELL MPPI IT IS A MECANUM ROBOT
      motion_model: "Omni"
      
      # Velocity limits (Make X and Y equal for smooth diagonal movement)
      vx_max: 0.5
      vx_min: -0.5
      vy_max: 0.5
      vy_min: -0.5
      vtheta_max: 1.0

      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.4
      
      # Remove "PreferForwardCritic" and "PathAngleCritic" to prevent RC-car behavior
      critics: ["ConstraintCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic"]
      
      # Critic Weights
      ConstraintCritic.scale: 20.0
      PathFollowCritic.scale: 5.0
      GoalCritic.scale: 3.0
      
      # Turn these down so the robot strafes instead of turning to face the path
      GoalAngleCritic.scale: 0.0 
      PathAlignCritic.scale: 0.0    

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner" # <--- Fixed with double colons!
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "my_robot_nav2_behavior::MecanumEscape"
      odom_topic: /odom
      projection_step: 0.05
      search_distance: 0.60
      clearance_margin: 0.05
      simulate_ahead_time: 2.0
      min_remembered_speed: 0.03
      velocity_memory_duration: 30.0
      direction_preference_weight: 0.35
      clearance_weight: 0.65
    wait:
      plugin: "nav2_behaviors::Wait"

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      robot_radius: 0.30   # Replace with your actual physical robot radius in meters
      resolution: 0.05
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          obstacle_max_range: 2.5
      
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.30   # Replace with your actual physical robot radius in meters
      plugins: ["obstacle_layer", "inflation_layer"]
      
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          obstacle_max_range: 2.5
      
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

collision_monitor:
  ros__parameters:
    use_sim_time: false
    cmd_vel_in_topic: "cmd_vel_nav"
    cmd_vel_out_topic: "cmd_vel"
    update_frequency: 10.0
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    transform_tolerance: 0.5
    source_timeout: 2.0
    stop_pub_timeout: 0.5
    # Define what data stream the collision monitor should watch
    observation_sources: ["scan"]
    
    scan:
      type: "scan"
      topic: "/scan"

    # # Define the safety zones relative to base_link
    # polygons: ["polygon_stop"]
    
    # polygon_stop:
    #   type: "polygon"
    #   points: [0.3, 0.3, 0.3, -0.3, -0.3, -0.3, -0.3, 0.3]
    #   action_type: "STOP"
    #   min_points: 3
    #   visualize: true
    polygons: ["PolygonStop"]
    PolygonStop:
      type: "circle"
      radius: 0.44
      action_type: "stop"
      min_points: 4  # max_points: 3 for Humble
      visualize: True
      polygon_pub_topic: "polygon_stop"
      enabled: True

      # polygons: ["PolygonStop"]
      # PolygonStop:
      #   type: "polygon"
      #   # Outer quotes are required so ROS 2 parses this as a string:
      #   points: "[[0.375, 0.30], [0.375, -0.30], [-0.375, -0.30], [-0.375, 0.30]]"
      #   action_type: "stop"
      #   min_points: 4
      #   visualize: True
      #   polygon_pub_topic: "polygon_stop"
      #   enabled: True

docking_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_link"
    odom_frame: "odom"
    
    # Provide a dummy charging dock to satisfy the server
    dock_plugins: ['charging_dock']
    charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.5
      use_external_detection_pose: false
      use_battery_status: false

slam_toolbox:
  ros__parameters:
    use_sim_time: false
    odom_frame: "odom"
    base_frame: "base_link"
    scan_topic: "/scan"
    mode: "mapping"
  # Correct Map Expansion Parameters
    resolution: 0.05
    max_laser_range: 10.0            # Adjust based on your lidar's max range
    minimum_time_interval: 0.5       # Update the map every 0.5 seconds
    minimum_travel_distance: 0.1     # Expand the map every 10 centimeters! (Fixes the out of bounds)
    minimum_travel_heading: 0.1      # Expand the map when rotating
    # Internal Solver Parameters
    transform_timeout: 0.5
    tf_buffer_duration: 30.0
    transform_publish_period: 0.05

velocity_smoother:
  ros__parameters:
    input_topic: "cmd_vel_smooth"
    output_topic: "cmd_vel"
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    
    # FORMAT IS: [X, Y, THETA]
    # This is the magic unlock: Ensure the middle number (Y) matches your X limit!
    max_velocity: [0.5, 0.5, 1.0]     
    min_velocity: [-0.5, -0.5, -1.0]  
    
    # You MUST also provide Y-axis acceleration limits, or it will refuse to slide
    max_accel: [2.5, 2.5, 3.2]
    max_decel: [-2.5, -2.5, -3.2]
    
    deadband_velocity: [0.0, 0.0, 0.0]
    odom_topic: "odom"
    odom_duration: 0.1

# ==============================================================================
# LIFECYCLE MANAGEMENT (Brings the stack up in sequence)
# ==============================================================================
lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: ['controller_server',
                'velocity_smoother',
                'planner_server',
                'behavior_server',
                'bt_navigator',
                'collision_monitor'] #

lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: ['amcl']

