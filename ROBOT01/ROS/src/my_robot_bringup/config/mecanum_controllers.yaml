controller_manager:
  ros__parameters:
    update_rate: 50

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    imu_sensor_1_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster

    imu_sensor_2_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster

    ir_sensor_1_broadcaster:
      type: range_sensor_broadcaster/RangeSensorBroadcaster

    ir_sensor_2_broadcaster:
      type: range_sensor_broadcaster/RangeSensorBroadcaster

    ir_sensor_3_broadcaster:
      type: range_sensor_broadcaster/RangeSensorBroadcaster

    ir_sensor_4_broadcaster:
      type: range_sensor_broadcaster/RangeSensorBroadcaster

    mecanum_drive_controller:
      type: mecanum_drive_controller/MecanumDriveController

imu_sensor_1_broadcaster:
  ros__parameters:
    sensor_name: "imu_sensor_1"
    frame_id: "imu_sensor_1"

imu_sensor_2_broadcaster:
  ros__parameters:
    sensor_name: "imu_sensor_2"
    frame_id: "imu_sensor_2"

ir_sensor_1_broadcaster:
  ros__parameters:
    sensor_name: "ir_sensor_1"
    frame_id: "ir_sensor_1"
    radiation_type: 1

ir_sensor_2_broadcaster:
  ros__parameters:
    sensor_name: "ir_sensor_2"
    frame_id: "ir_sensor_2"
    radiation_type: 1

ir_sensor_3_broadcaster:
  ros__parameters:
    sensor_name: "ir_sensor_3"
    frame_id: "ir_sensor_3"
    radiation_type: 1

ir_sensor_4_broadcaster:
  ros__parameters:
    sensor_name: "ir_sensor_4"
    frame_id: "ir_sensor_4"
    radiation_type: 1

mecanum_drive_controller:
  ros__parameters:
    front_left_wheel_command_joint_name: front_left_wheel_joint
    front_right_wheel_command_joint_name: front_right_wheel_joint
    rear_left_wheel_command_joint_name: rear_left_wheel_joint
    rear_right_wheel_command_joint_name: rear_right_wheel_joint
    front_left_wheel_state_joint_name: front_left_wheel_joint
    front_right_wheel_state_joint_name: front_right_wheel_joint
    rear_left_wheel_state_joint_name: rear_left_wheel_joint
    rear_right_wheel_state_joint_name: rear_right_wheel_joint
    kinematics:
      wheels_radius: 0.10
      wheelbase: 0.44
      wheel_separation: 0.46
      sum_of_robot_center_projection_on_X_Y_axis: 0.45
    cmd_vel_timeout: 0.5
    reference_timeout: 1.0
    odom_frame_id: odom
    base_frame_id: base_link
    enable_odom_tf: true
    publish_rate: 50.0
